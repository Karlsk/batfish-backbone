! Synthetic Cisco IOS configuration for Batfish Web functional tests.
version 15.2
hostname c2
!
interface Loopback0
 ip address 10.64.0.2 255.255.255.255
!
interface GigabitEthernet0/0
 description to-c1
 ip address 172.20.12.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet0/1
 description to-c4
 ip address 172.20.24.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
router ospf 1
 router-id 10.64.0.2
 passive-interface Loopback0
 network 10.64.0.0 0.0.0.255 area 0
 network 172.20.0.0 0.0.255.255 area 0
!
end
