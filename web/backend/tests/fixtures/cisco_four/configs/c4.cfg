! Synthetic Cisco IOS configuration for Batfish Web functional tests.
version 15.2
hostname c4
!
interface Loopback0
 ip address 10.64.0.4 255.255.255.255
!
interface GigabitEthernet0/0
 description to-c2
 ip address 172.20.24.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet0/1
 description to-c3
 ip address 172.20.34.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
router ospf 1
 router-id 10.64.0.4
 passive-interface Loopback0
 network 10.64.0.0 0.0.0.255 area 0
 network 172.20.0.0 0.0.255.255 area 0
!
end
