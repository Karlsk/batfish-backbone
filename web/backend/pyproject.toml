[project]
name = "batfish-web-backend"
version = "0.1.0"
description = "Batfish Web API and worker foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pybatfish==2026.9.17.3748",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=25.1,<26",
  "python-multipart>=0.0.20,<0.1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest==8.4.2", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../scripts"]
markers = [
  "integration: requires an explicitly configured isolated Batfish engine",
  "lab: requires the local service lab and its two seeded configuration snapshots",
  "smoke: fast checks against running services and seeded snapshots",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
