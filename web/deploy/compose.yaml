x-app: &app
  image: bfw-backend:${BFW_RELEASE:?required}
  env_file: ${BFW_STATE:?required}/app.env
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  volumes: [appdata:/data]
  networks: [internal]
  init: true
  stop_grace_period: 120s
services:
  db:
    image: postgres:17-alpine@sha256:67f624a4ad70edba8d65c82341124fab7054b277b4f7dea4b04be6f939ce2314
    environment:
      POSTGRES_DB: batfish
      POSTGRES_USER: batfish
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U batfish -d batfish"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  volume-init:
    <<: *app
    user: "0:0"
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    volumes: [appdata:/data, enginedata:/engine-data]
    command: [python, -c, "import os; [(os.chown(p,10001,10001),os.chmod(p,0o700)) for p in ['/data','/engine-data']]"]
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
      volume-init: {condition: service_completed_successfully}
  engine:
    image: bfw-engine:${BFW_RELEASE:?required}
    build:
      context: ${BFW_STATE:?required}/engine
      dockerfile: Dockerfile
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes: [enginedata:/data]
    networks: [internal]
    init: true
    mem_limit: 5g
    stop_grace_period: 120s
    depends_on:
      volume-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /engine/health.sh]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  api:
    <<: *app
    build:
      context: ..
      dockerfile: backend/Dockerfile
    depends_on:
      migrate: {condition: service_completed_successfully}
      engine: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    <<: *app
    command: [python, -m, app.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      engine: {condition: service_healthy}
    restart: "no"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://api:8000/api/v1/health/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  proxy:
    image: bfw-frontend:${BFW_RELEASE:?required}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - ${BFW_STATE:?required}/tls/cert.pem:/run/tls/cert.pem:ro
      - ${BFW_STATE:?required}/tls/key.pem:/run/tls/key.pem:ro
    ports: ["${BFW_BIND:-127.0.0.1}:${BFW_PORT:-18443}:8443"]
    networks: [internal, edge]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --no-check-certificate, -q, -O, /dev/null, https://127.0.0.1:8443/api/v1/health/live]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  pgdata:
  appdata:
  enginedata:
networks:
  internal: {internal: true}
  edge: {}
secrets:
  db_password:
    file: ${BFW_STATE:?required}/db-password
